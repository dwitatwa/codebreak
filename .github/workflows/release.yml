name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build viewer shell + binaries (5 platform)
        run: bun run build

      - name: Smoke test linux binary
        run: packages/cli/dist-binaries/codebreak-linux-x64 --version

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/dist-binaries/codebreak-*
          generate_release_notes: true
